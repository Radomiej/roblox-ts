name: ESLint

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox-ts
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: roblox-ts

      - name: Checkout compiler-types
        uses: actions/checkout@v4
        with:
          repository: Radomiej/compiler-types
          ref: main
          path: compiler-types

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install NPM Dependencies
        working-directory: roblox-ts
        run: npm ci --no-audit --no-fund

      - name: Cache ESLint
        uses: actions/cache@v4.3.0
        with:
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('roblox-ts/**/package-lock.json', 'roblox-ts/eslint.config.*') }}-${{ github.run_id }}
          path: roblox-ts/.eslintcache
          restore-keys: |
            eslint-cache-${{ runner.os }}-${{ hashFiles('roblox-ts/**/package-lock.json', 'roblox-ts/eslint.config.*') }}-
            eslint-cache-${{ runner.os }}-

      - name: Run ESLint
        working-directory: roblox-ts
        run: npm run eslint:ci
