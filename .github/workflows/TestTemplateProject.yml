name: Test create-roblox-ts

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        type: [game, place, model, plugin, package]
    steps:
      - name: Checkout roblox-ts repo
        uses: actions/checkout@v4
        with:
          path: roblox-ts

      - name: Checkout compiler-types
        uses: actions/checkout@v4
        with:
          repository: Radomiej/compiler-types
          ref: main
          path: compiler-types

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup roblox-ts repo
        working-directory: roblox-ts
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Create template project
        run: npm init roblox-ts@latest ${{ matrix.type }} -- -y --dir project --skipBuild

      - name: Install local roblox-ts
        run: |
          cd project
          npm install --install-links ../roblox-ts

      - name: Build
        run: |
          cd project
          npm run build
