name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roblox-ts
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: roblox-ts

      - name: Checkout compiler-types
        uses: actions/checkout@v4
        with:
          repository: Radomiej/compiler-types
          ref: main
          path: compiler-types

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install NPM Dependencies
        working-directory: roblox-ts
        run: npm ci --no-audit --no-fund

      - name: Compile Source Files
        working-directory: roblox-ts
        run: npm run build
