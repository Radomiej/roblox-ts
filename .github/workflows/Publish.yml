name: Publish

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out roblox-ts
        uses: actions/checkout@v4
        with:
          path: roblox-ts

      - name: Check out compiler-types
        uses: actions/checkout@v4
        with:
          repository: Radomiej/compiler-types
          ref: main
          path: compiler-types

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install compiler-types dependencies and lint
        working-directory: compiler-types
        run: |
          npm ci --no-audit --no-fund
          npm run eslint

      - name: Install roblox-ts dependencies
        working-directory: roblox-ts
        run: npm ci --no-audit --no-fund

      - name: Install test dependencies
        working-directory: roblox-ts/tests
        run: npm ci --no-audit --no-fund

      - name: Install Lune and Rojo
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/roblox-tools"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 2 --max-time 120 https://github.com/lune-org/lune/releases/download/v0.8.9/lune-0.8.9-linux-x86_64.zip -o "$RUNNER_TEMP/lune.zip"
          printf '%s  %s\n' eb30bdde967ba97951a4e0cafa0a197396ddd68dfc58e1b60349129c178eee8b "$RUNNER_TEMP/lune.zip" | sha256sum --check -
          unzip -o "$RUNNER_TEMP/lune.zip" -d "$tool_dir"
          curl --fail --location --retry 2 --max-time 120 https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip -o "$RUNNER_TEMP/rojo.zip"
          printf '%s  %s\n' 784e2cd42af3d565826c4910df94f45080fc7ed6206eb6808dbc79b516323652 "$RUNNER_TEMP/rojo.zip" | sha256sum --check -
          unzip -o "$RUNNER_TEMP/rojo.zip" -d "$tool_dir"
          chmod +x "$tool_dir"/*
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Run roblox-ts checks
        working-directory: roblox-ts
        run: |
          npm run eslint
          npm test
          npm pack --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out roblox-ts
        uses: actions/checkout@v4
        with:
          path: roblox-ts

      - name: Check out compiler-types
        uses: actions/checkout@v4
        with:
          repository: Radomiej/compiler-types
          ref: main
          path: compiler-types

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm supports Trusted Publishing
        run: |
          set -euo pipefail
          npm_is_supported() {
            node -e 'const [major, minor, patch] = require("child_process").execSync("npm --version", {encoding: "utf8"}).trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)'
          }
          if ! npm_is_supported; then
            npm install --global 'npm@^11.5.1'
          fi
          npm_is_supported

      - name: Install roblox-ts dependencies
        working-directory: roblox-ts
        run: npm ci --no-audit --no-fund

      - name: Publish if this version is new
        working-directory: roblox-ts
        run: |
          set -euo pipefail
          package=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          error_file="$RUNNER_TEMP/npm-view-error.txt"
          if npm view "$package@$version" version >/dev/null 2>"$error_file"; then
            echo "$package@$version is already published; skipping."
          elif grep -Eq 'E404|404 Not Found' "$error_file"; then
            publish_args=(--provenance --access public)
            if [[ "$version" == *-* ]]; then
              publish_args+=(--tag beta)
            fi
            npm publish "${publish_args[@]}"
          else
            cat "$error_file" >&2
            exit 1
          fi
